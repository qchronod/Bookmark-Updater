<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 320px;
            margin: 0;
            padding: 12px;
            background: #f9f9f9;
            color: #333;
        }
        h3 {
            margin-top: 0;
            font-size: 15px;
            color: #111;
        }
        p {
            font-size: 13px;
            line-height: 1.4;
        }
        .bookmark-item {
            background: #fff;
            border: 1px solid #ddd;
            padding: 8px;
            margin-bottom: 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .bookmark-item:hover {
            background: #eef2f7;
            border-color: #bcd;
        }
        .b-title {
            font-weight: 600;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .b-url {
            font-size: 11px;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #status {
            font-size: 13px;
            font-weight: 500;
            color: #0066cc;
        }
    </style>
</head>
<body>
    <h3>Bookmark Updater</h3>
    <div id="status">Searching bookmarks...</div>
    <div id="choices" style="margin-top: 10px;"></div>

    <script src="popup.js"></script>
</body>
</html>
